<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: white;
        }
        .btn-login {
            background-color: #ff6b35; /* Color estilo Phoenix */
            color: white;
            font-weight: 600;
            border: none;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
        }
        .btn-login:hover {
            background-color: #e85a28;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h3 class="mb-4" style="font-weight: 800; color: #2d3748;">TechStore Admin</h3>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
        <div class="mb-3 text-start">
            <label class="form-label" style="font-weight: 600; color: #4a5568;">Usuario</label>
            <input type="text" name="username" class="form-control" required placeholder="admin">
        </div>
        <div class="mb-4 text-start">
            <label class="form-label" style="font-weight: 600; color: #4a5568;">Contraseña</label>
            <input type="password" name="password" class="form-control" required placeholder="123456">
        </div>
        <button type="submit" class="btn btn-login">Iniciar Sesión</button>
    </form>
</div>

</body>
</html>
